[package]
name = "tetris"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "A Tetris-style game written in pure Rust, compiled to WebAssembly"

[lib]
name = "tetris"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# No dependencies at all: the whole game (logic + software renderer) is plain Rust
# compiled straight to a .wasm module. Keeps the artifact tiny and the build offline-safe.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
